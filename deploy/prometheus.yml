# Prometheus 抓取配置示例
# metrics_token 在 config/tsumugi.json 中（首次启动自动生成）。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: tsumugi
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:10232"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tsumugi_metrics_token
    # 或者用 query 参数：params: { token: ["<metrics_token>"] }
