services:
  tsumugi:
    build: .
    container_name: tsumugi
    restart: unless-stopped
    ports:
      - "9999:9999"      # 二进制协议
      - "10232:10232"    # 监控 / 管理面板
      - "3309:3309"      # MySQL 兼容协议
    environment:
      TSUMUGI_DURABILITY: "batch"
      TSUMUGI_MYSQL: "true"
      TSUMUGI_MYSQL_PORT: "3309"
      TSUMUGI_PORT: "9999"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./backup:/app/backup
    healthcheck:
      # 面板端口是 10232（曾误写 8080 导致容器永久 unhealthy）
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:10232/api/setup/status"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
